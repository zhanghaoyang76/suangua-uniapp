<svg width="1400" height="960" viewBox="0 0 1400 960" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f0e5"/>
      <stop offset="0.52" stop-color="#eee2d0"/>
      <stop offset="1" stop-color="#d8e3dd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#4b3b2b" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 700 44px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #241a13; }
      .sub { font: 400 22px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #6b5b4a; }
      .card-title { font: 700 29px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #261b14; }
      .card-text { font: 400 19px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #695744; }
      .label { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #8d5f2f; }
      .mini { font: 400 17px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #574636; }
      .tag { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #fffaf3; }
      .button { font: 700 18px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #fffaf3; }
      .recommend { font: 700 16px "Microsoft YaHei", "PingFang SC", sans-serif; fill: #315949; }
    </style>
  </defs>

  <rect width="1400" height="960" fill="url(#bg)"/>
  <circle cx="1165" cy="138" r="92" fill="#c04432" opacity="0.08"/>
  <circle cx="1165" cy="138" r="58" fill="none" stroke="#c04432" stroke-width="2" opacity="0.18"/>
  <text x="86" y="92" class="title">奇门遁甲小程序：首版产品方案</text>
  <text x="88" y="132" class="sub">定位：大众娱乐可用，但展示必要的起局过程；真实规则排盘，解读先简化，AI 深解入口预留。</text>

  <g transform="translate(74,190)">
    <rect x="0" y="0" width="392" height="650" rx="18" fill="#fffaf4" filter="url(#shadow)"/>
    <rect x="0" y="0" width="392" height="94" rx="18" fill="#6f3f2e"/>
    <text x="28" y="58" class="tag">A. 快速娱乐型</text>

    <rect x="32" y="128" width="328" height="318" rx="12" fill="#f3eadc" stroke="#dec9ad"/>
    <rect x="56" y="158" width="280" height="48" rx="8" fill="#fffaf4" stroke="#d5c2a8"/>
    <text x="74" y="188" class="mini">我想问最近这件事能不能成...</text>
    <rect x="56" y="228" width="148" height="48" rx="8" fill="#a33d2f"/>
    <text x="86" y="259" class="button">立即起局</text>
    <rect x="56" y="302" width="280" height="48" rx="8" fill="#ffffff" stroke="#d5c2a8"/>
    <text x="82" y="333" class="mini">断语优先展示</text>
    <rect x="56" y="370" width="280" height="48" rx="8" fill="#ffffff" stroke="#d5c2a8"/>
    <text x="82" y="401" class="mini">展开查看起局过程</text>

    <text x="32" y="502" class="card-title">问完立刻给结论</text>
    <text x="32" y="548" class="card-text">用户最快看到吉凶宜忌，</text>
    <text x="32" y="578" class="card-text">爽感强，门槛最低。</text>
    <text x="32" y="622" class="card-text">不足：奇门特色会弱一点。</text>
  </g>

  <g transform="translate(504,162)">
    <rect x="0" y="0" width="392" height="706" rx="18" fill="#fffaf4" filter="url(#shadow)" stroke="#315949" stroke-width="4"/>
    <rect x="0" y="0" width="392" height="94" rx="18" fill="#315949"/>
    <text x="28" y="58" class="tag">B. 仪式感平衡型</text>
    <rect x="246" y="24" width="104" height="34" rx="17" fill="#e8d5a8"/>
    <text x="266" y="47" class="recommend">推荐</text>

    <rect x="32" y="128" width="328" height="380" rx="12" fill="#edf3ee" stroke="#b9c9be"/>
    <rect x="56" y="158" width="280" height="44" rx="8" fill="#fffaf4" stroke="#c9d5cc"/>
    <text x="74" y="186" class="mini">输入问事</text>
    <rect x="56" y="220" width="110" height="46" rx="8" fill="#315949"/>
    <text x="91" y="250" class="button">起局</text>
    <rect x="56" y="292" width="280" height="42" rx="8" fill="#ffffff" stroke="#c9d5cc"/>
    <text x="74" y="319" class="mini">时间 / 阴阳遁 / 局数</text>
    <g transform="translate(74,356)">
      <rect width="72" height="50" fill="#fffaf4" stroke="#bdac93"/>
      <rect x="72" width="72" height="50" fill="#ffffff" stroke="#bdac93"/>
      <rect x="144" width="72" height="50" fill="#fffaf4" stroke="#bdac93"/>
      <rect y="50" width="72" height="50" fill="#ffffff" stroke="#bdac93"/>
      <rect x="72" y="50" width="72" height="50" fill="#f4e7d6" stroke="#bdac93"/>
      <rect x="144" y="50" width="72" height="50" fill="#ffffff" stroke="#bdac93"/>
      <rect y="100" width="72" height="50" fill="#fffaf4" stroke="#bdac93"/>
      <rect x="72" y="100" width="72" height="50" fill="#ffffff" stroke="#bdac93"/>
      <rect x="144" y="100" width="72" height="50" fill="#fffaf4" stroke="#bdac93"/>
      <text x="86" y="82" class="label">中宫</text>
    </g>

    <text x="32" y="564" class="card-title">先看起局，再看断语</text>
    <text x="32" y="610" class="card-text">展示起局依据、九宫盘简图，</text>
    <text x="32" y="640" class="card-text">再给传统断语与宜忌。</text>
    <text x="32" y="684" class="card-text">最贴合“大众娱乐 + 过程可见”。</text>
  </g>

  <g transform="translate(934,190)">
    <rect x="0" y="0" width="392" height="650" rx="18" fill="#fffaf4" filter="url(#shadow)"/>
    <rect x="0" y="0" width="392" height="94" rx="18" fill="#4d5362"/>
    <text x="28" y="58" class="tag">C. 半专业探索型</text>

    <rect x="32" y="128" width="328" height="318" rx="12" fill="#ebeef2" stroke="#c1c7d1"/>
    <g transform="translate(78,158)">
      <rect width="70" height="62" fill="#fffaf4" stroke="#aeb5c0"/>
      <rect x="70" width="70" height="62" fill="#ffffff" stroke="#aeb5c0"/>
      <rect x="140" width="70" height="62" fill="#fffaf4" stroke="#aeb5c0"/>
      <rect y="62" width="70" height="62" fill="#ffffff" stroke="#aeb5c0"/>
      <rect x="70" y="62" width="70" height="62" fill="#dee4ec" stroke="#aeb5c0"/>
      <rect x="140" y="62" width="70" height="62" fill="#ffffff" stroke="#aeb5c0"/>
      <rect y="124" width="70" height="62" fill="#fffaf4" stroke="#aeb5c0"/>
      <rect x="70" y="124" width="70" height="62" fill="#ffffff" stroke="#aeb5c0"/>
      <rect x="140" y="124" width="70" height="62" fill="#fffaf4" stroke="#aeb5c0"/>
    </g>
    <rect x="56" y="374" width="280" height="42" rx="8" fill="#ffffff" stroke="#c1c7d1"/>
    <text x="86" y="401" class="mini">点击宫位看解释</text>

    <text x="32" y="502" class="card-title">盘面作为主屏</text>
    <text x="32" y="548" class="card-text">互动更强，后续扩展好。</text>
    <text x="32" y="592" class="card-text">不足：首版开发与解释成本</text>
    <text x="32" y="622" class="card-text">都会更高。</text>
  </g>

  <text x="86" y="910" class="sub">建议选择 B：进入页输入问事 → 按当前时间起局 → 显示轻量过程 → 给传统断语 → 提供“AI 深度解读”按钮。</text>
</svg>
