      <text x="132" y="-124" text-anchor="middle">伤</text>
      <text x="-132" y="12" text-anchor="middle">杜</text>
      <text x="0" y="12" text-anchor="middle">戊</text>
      <text x="132" y="12" text-anchor="middle">景</text>
      <text x="-132" y="148" text-anchor="middle">死</text>
      <text x="0" y="148" text-anchor="middle">惊</text>
      <text x="132" y="148" text-anchor="middle">开</text>
