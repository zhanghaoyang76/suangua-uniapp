      .faded { font: 400 24px "STKaiti", "KaiTi", "SimKai", serif; fill: #5e496e; letter-spacing: 0; }
      .sealText { font: 700 30px "STKaiti", "KaiTi", "SimKai", serif; fill: #f0d5aa; letter-spacing: 0; }
