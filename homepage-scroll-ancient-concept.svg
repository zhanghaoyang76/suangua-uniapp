      <stop offset="0.52" stop-color="#0b0610"/>
      <stop offset="1" stop-color="#020102"/>
    </radialGradient>
    <linearGradient id="oldPaper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2130" stop-opacity="0.56"/>
      <stop offset="0.5" stop-color="#141018" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#070508" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="wornGold" x1="0" y1="0" x2="1" y2="1">
